name: Ultimate APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Find and Build APK
        run: |
          # البحث التلقائي عن ملف التشغيل في أي مجلد فرعي ومنحه الصلاحيات
          GRADLEW_PATH=$(find . -name "gradlew" -type f)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found!"
            exit 1
          fi
          
          DIR_PATH=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew at: $DIR_PATH"
          
          chmod +x "$GRADLEW_PATH"
          echo "sdk.dir=$ANDROID_HOME" > "$DIR_PATH/local.properties"
          
          cd "$DIR_PATH"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
